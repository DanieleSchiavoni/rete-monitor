spring.application.name=rete-monitor

# La 8080 è spesso occupata: il backend usa la 8081
server.port=${SERVER_PORT:8081}

# ---------- Database MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/rete_monitor?createDatabaseIfNotExist=true&serverTimezone=Europe/Rome
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Lo schema è gestito da Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ---------- Accesso (JWT) ----------
# Chiave segreta per firmare i token: almeno 32 caratteri.
# Se è vuota ne viene generata una casuale a ogni avvio (dopo un riavvio bisogna rifare il login).
jwt.segreto=${JWT_SEGRETO:}
jwt.durata-ore=12

# ---------- Scansione della rete ----------
# Ogni quanto ripetere la scansione automatica (millisecondi)
rete.intervallo-ms=60000
# Nome dell'interfaccia da usare (es. en0 su Mac, wlan0 su Linux). Vuoto = scelta automatica
rete.interfaccia=
# Sottorete da scansionare in formato CIDR (es. 192.168.1.0/24). Vuoto = ricavata dall'interfaccia
rete.sottorete=
# Quanti indirizzi controllare in parallelo
rete.thread=64
# Tempo massimo di attesa per il ping e per le porte TCP (millisecondi)
rete.timeout-ping-ms=1000
rete.timeout-porta-ms=300
# Tempo di attesa per ogni porta nel controllo dettagliato di un dispositivo
rete.timeout-porte-dettaglio-ms=700
# Porte TCP provate quando il dispositivo non risponde al ping
rete.porte=80,443,22,445,139,554,8080,8009,7000,62078
# Un dispositivo presente nella tabella ARP conta come acceso anche se non risponde al ping
rete.arp-come-presenza=true
# Scansioni consecutive senza risposta prima di segnare un dispositivo come spento
rete.scansioni-mancate-per-offline=2
# File facoltativo con l'elenco dei produttori (oui.csv dell'IEEE)
rete.file-oui=oui.csv
